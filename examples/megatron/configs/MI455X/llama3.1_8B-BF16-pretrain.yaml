#
# Llama-3.1-8B BF16 pretraining on MI455X (gfx1250), Megatron backend.
#
# Full model (32 layers, hidden 4096, GQA 32/8), seq 8192, mock data, no activation
# recompute. Attention runs on Primus-Turbo's FlyDSL kernels: they need a Primus-Turbo with
# the gfx1250 head-dim-128 attention (see examples/megatron/models/llama3.1-8b/README.md).
###############################################################################

work_group: ${PRIMUS_TEAM:amd}
user_name: ${PRIMUS_USER:root}
exp_name: ${PRIMUS_EXP_NAME:llama3.1_8B-pretrain}
workspace: ${PRIMUS_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    # model to run
    model: llama3.1_8B.yaml
    overrides:
      # log
      wandb_project: "Primus_Llama_Pretrain"
      stderr_sink_level: DEBUG
      log_avg_skip_iterations: 2
      log_avg_reset_interval: 50

      # hyper parameters
      train_iters: 10
      micro_batch_size: 4
      global_batch_size: 16
      seq_length: ${PRIMUS_SEQ_LENGTH:8192}
      max_position_embeddings: ${PRIMUS_MAX_POSITION_EMBEDDINGS:8192}
      lr: 1.0e-5
      min_lr: 0.0
      lr_warmup_iters: 2
      lr_decay_iters: null
      lr_decay_style: cosine
      weight_decay: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.95
      eod_mask_loss: true
      init_method_std: 0.008
      norm_epsilon: 1.0e-6

      # parallel
      tensor_model_parallel_size: ${PRIMUS_TP:1}
      pipeline_model_parallel_size: ${PRIMUS_PP:1}
      expert_model_parallel_size: 1
      overlap_grad_reduce: true
      overlap_param_gather: true
      gradient_accumulation_fusion: false

      # data
      mock_data: true
      # causal attention takes no mask: do not build and copy a [seq, seq] one per sample
      create_attention_mask_in_dataloader: false
      train_data_path: ${PRIMUS_TOKENIZED_DATA_PATH:null}
      valid_data_path: null
      test_data_path: null

      # recompute: off
      recompute_granularity: null
      recompute_layer_ids: null

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      no_load_optim: null
      no_load_rng: null
      save: null
      save_interval: 20000
      no_save_optim: null
      no_save_rng: null
      disable_last_saving: true
      ckpt_format: torch
      eval_iters: 0

      # primus-turbo: FlyDSL attention (PRIMUS_TURBO_ATTN_BACKEND) and RMSNorm
      enable_primus_turbo: true
      use_turbo_attention: true
      use_turbo_rms_norm: true
      # MLP SwiGLU on Primus-Turbo's kernels (a Primus-Turbo without them keeps Megatron's)
      use_turbo_swiglu: true
      # packed-QKV RoPE without a split, on Primus-Turbo's fused QKV RoPE kernels (Triton on gfx1250;
      # PRIMUS_TURBO_ROPE_BACKEND=FLYDSL picks its FlyDSL ones)
      fused_single_qkv_rope: true
      use_turbo_fused_qkv_rope: true

      # dgrad GEMMs as TN on a transposed weight (hipBLASLt runs TN faster on gfx1250; the tuning file
      # in examples/megatron/models/llama3.1-8b/hipblaslt_tuning/ has rows for those shapes)
      te_dgrad_transposed_weight: true

      # DDP's backward hook copies each parameter's first gradient of a step into the gradient buffer
      # instead of adding it; with one micro-batch per step the next step skips clearing the buffer
      grad_buffer_first_write: true

      # precision-aware optimizer with Megatron's defaults (FP32 gradients and moments, FP32 master
      # weights kept as int16 remainders of the BF16 params): the Triton param-remainder Adam updates
      # the BF16 params in place, without the FP32 -> BF16 copy pass, in a few batched launches
      use_precision_aware_optimizer: true

      # cross entropy: Primus-Turbo's, its backward overwriting the logits with their gradient
      cross_entropy_fusion_impl: "te"
      cross_entropy_loss_fusion: true
      use_turbo_cross_entropy: true
      turbo_ce_overwrite_input: true
